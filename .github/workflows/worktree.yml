name: Worktree toolkit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worktree-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    name: Real app backend isolation
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=1
      - run: pnpm test:pr-standard
      - run: pnpm test:worktree
      - run: pnpm test:worktree:integration
      - name: Teardown checkout-owned services
        if: always()
        run: node scripts/worktree/cli.mjs teardown
